name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# a newer push queues behind a running deploy instead of cancelling it halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # build and deploy in one job, so every change to master is a single run with a single job
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.x'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # vite-imagetools caches every generated image variant here, restoring it saves re-encoding them all on each deploy
      - name: Cache generated images
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/imagetools
          key: imagetools-${{ hashFiles('src/data/projects/**', 'vite.config.mts') }}
          restore-keys: imagetools-

      - name: Build project
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
